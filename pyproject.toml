[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-router-agent"
version = "0.1.0"
description = "Provider-agnostic intent router agent: prompt-injection defense, regex-first routing with LLM fallback, code-gated tools and typed Pydantic envelopes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaffeth Alfaro" }]
keywords = ["llm", "agent", "pydantic", "router", "prompt-injection", "watsonx", "evals"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.1"]
watsonx = ["ibm-watsonx-ai>=1.1"]
groq = ["groq>=0.9"]
huggingface = ["huggingface_hub>=0.24"]
ollama = ["ollama>=0.4"]

[project.scripts]
router-agent = "router_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
